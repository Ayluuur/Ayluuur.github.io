<button class="mobile btn-mobile-menu" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="site-navigation">
  <span class="btn-mobile-menu__icon">&#9776;</span>
  <span class="btn-mobile-close__icon hidden">&#215;</span>
</button>

<header class="panel-cover{% if page.url != '/' %} panel-cover--collapsed{% endif %}" style="background-image: url({{ site.baseurl }}{{ site.bkimage }})">
  <div class="panel-main">
    <div class="panel-main__inner panel-inverted">
      <div class="panel-main__content">
        <a href="{{ site.baseurl }}/" title="Home of {{ site.title }}">
          <img src="{{ site.baseurl }}{{ site.profilepic }}" class="user-image" alt="Portrait of Yilun Sheng">
          <h1 class="panel-cover__title panel-title">Yilun Sheng (&#30427;&#36920;&#20262;)</h1>
        </a>
        <hr class="panel-cover__divider">
        <p class="panel-cover__description">Master in NJUPT. Focusing on Virtual Reality and Machine Learning.</p>
        <hr class="panel-cover__divider panel-cover__divider--secondary">

        <div class="navigation-wrapper" id="site-navigation">
          <nav class="cover-navigation cover-navigation--primary" aria-label="Page sections">
            <ul class="navigation">
              <li class="navigation__item"><a href="{{ site.baseurl }}/about/" class="page-link-button{% if page.url == '/about/' %} is-active{% endif %}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About Me</a></li>
              <li class="navigation__item"><a href="{{ site.baseurl }}/portfolio/" class="page-link-button{% if page.url == '/portfolio/' %} is-active{% endif %}"{% if page.url == '/portfolio/' %} aria-current="page"{% endif %}>Portfolio</a></li>
            </ul>
          </nav>

          <nav class="profile-links" aria-label="Personal links">
            <a class="profile-link" href="https://www.google.com/maps/search/?api=1&amp;query=Nanjing%2C%20China" target="_blank" rel="noopener noreferrer">
              <img src="{{ site.baseurl }}/images/icons/location.svg" alt=""> <span>Nanjing, China</span>
            </a>
            <a class="profile-link" href="mailto:yilun205@163.com">
              <img src="{{ site.baseurl }}/images/icons/email.svg" alt=""> <span>Email</span>
            </a>
            <a class="profile-link" href="https://github.com/Ayluuur" target="_blank" rel="noopener noreferrer">
              <img class="contact-icon--brand" src="{{ site.baseurl }}/images/icons/github.svg" alt=""> <span>GitHub</span>
            </a>
            <a class="profile-link" href="https://scholar.google.com/citations?hl=zh-CN&amp;view_op=list_works&amp;gmla=AKCpqFybEwAYiZfzMV1nQWcUaxl6iBbwZi4y6MFTo4nFWyWQH26FDOFGrrb804QMs1HE0p04C37Flu91q31wrtWjuYc&amp;user=PsK9BVkAAAAJ" target="_blank" rel="noopener noreferrer">
              <img class="contact-icon--brand" src="{{ site.baseurl }}/images/icons/scholar.svg" alt=""> <span>Google Scholar</span>
            </a>
          </nav>
        </div>
      </div>
    </div>
    <div class="panel-cover--overlay"></div>
  </div>
</header>
